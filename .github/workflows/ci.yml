name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python tools/check_docs.py
      - run: python tools/generate_public_api_manifest.py --check
      - run: python -m ruff check src tests tools
      - run: python -m mypy src/fpg_core
      - run: python -m pytest
      - run: python -m build
      - run: python tools/check_distribution.py
      - name: Install built Core without Lab
        run: |
          python -m venv /tmp/core-consumer
          /tmp/core-consumer/bin/python -m pip install dist/*.whl
          /tmp/core-consumer/bin/python -c "from fpg_core.floor_plan_solver import build_default_profiles; import importlib.util; assert build_default_profiles().initial; assert importlib.util.find_spec('fpg_lab') is None; assert importlib.util.find_spec('nicegui') is None"
