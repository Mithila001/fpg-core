name: Lab integration

on:
  push:
    paths: ['src/**', 'pyproject.toml', 'fpg-lab/**', '.github/workflows/lab.yml']
  pull_request:
    paths: ['src/**', 'pyproject.toml', 'fpg-lab/**', '.github/workflows/lab.yml']
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run Lab automated tests and static checks
        type: boolean
        default: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fpg-lab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            fpg-lab/pyproject.toml
      - run: python -m pip install -e .. -e ".[dev]"
      - run: python -m scripts.verify_fpg_core
      - name: Select Lab suite
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL_FULL: ${{ inputs.full_tests }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "full=$MANUAL_FULL" >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD -- fpg-lab .github/workflows/lab.yml | grep -q .; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.full == 'true'
        run: python -m pytest
      - if: steps.scope.outputs.full == 'true'
        run: python -m ruff check fpg_lab scripts tests
      - if: steps.scope.outputs.full == 'true'
        run: python -m mypy fpg_lab scripts
