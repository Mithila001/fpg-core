[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpg-core"
version = "0.1.0"
description = "Reusable floor-plan generation algorithms and domain contracts."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "optuna>=3.6",
    "ortools>=9.10",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fpg_core*"]

[tool.setuptools.package-data]
fpg_core = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # These enums predate StrEnum. Migrating would change str(member), which is
    # observable behavior for consumers.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
packages = ["fpg_core"]
strict = false
follow_imports = "skip"
disable_error_code = ["import-untyped"]
warn_unused_configs = true

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
